services: 
  server:
    build: ./server
    env_file:
      - .env
    networks:
      - backend-network
    depends_on:
      db:
        condition: service_healthy
  nginx:
    image: nginx:stable
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - backend-network
    ports: 
      - 443:443
    depends_on:
      - server
  db: 
    image: postgres:17
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./server/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME} && psql -U ${DB_USER} -d ${DB_NAME} -c 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend-network

volumes:
  postgres:
    
networks:
  backend-network:
    driver: bridge
  